x-restart: &restart
  restart: "unless-stopped"
x-restart-failure: &restart_failure
  restart: "on-failure: 5"
x-logging: &logging
  logging:
    driver: local
    options:
      max-size: ${DOCKERLOGGING_MAXSIZE}
x-security: &security
  security_opt:
    - no-new-privileges:true
# https://rocm.docs.amd.com/projects/install-on-linux/en/docs-6.2.0/how-to/docker.html#docker-compose
x-rocm: &rocm
  devices:
    - /dev/kfd
    - /dev/dri
  security_opt:
    - seccomp:unconfined
  group_add:
    - video
x-rocm-env: &rocm-env
  # rocminfo | grep gfx1151 should return non-empty result if the workaround below is active
  HSA_OVERRIDE_GFX_VERSION: 11.0.0 # forces RDNA 3.5 compatibility since the 8060S isn't officially supported.
  HIP_VISIBLE_DEVICES: 0
  # If you encounter CL_OUT_OF_RESOURCES errors:
  # GGML_ROCM_WORKSPACE:4096  # Increase memory allocation

services:

  # https://docs.vllm.ai/en/stable/getting_started/installation/gpu/#pre-built-images
  vllm:
    image: rocm/vllm-dev:nightly
    network_mode: host
    group_add:
      - video
    shm_size: 121GB
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      - <path/to/your/models>:/app/models
    environment:
      - HF_HOME=/app/models

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    <<: [ *restart_failure, *logging, *security ]
    ports:
      - "${OPENWEBUI_PORT}:8080"
    environment:
      OLLAMA_API_BASE_URL: "http://litellm:4000"
      # https://github.com/open-webui/open-webui/discussions/12827
      # https://github.com/open-webui/open-webui/pull/12828
      PASS_HEADERS_TO_TOOL: True
      #WEBUI_AUTH_TRUSTED_EMAIL_HEADER: X-User-Email  # Maps to user's email [7]
      #WEBUI_AUTH_TRUSTED_NAME_HEADER: X-User-Name    # Optional display name [7]

      # https://www.authelia.com/integration/openid-connect/open-webui/
      WEBUI_URL: 'https://myopenwebui'
      ENABLE_OAUTH_SIGNUP: 'false'
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: 'true'
      OAUTH_CLIENT_ID: 'open-webui'
      OAUTH_CLIENT_SECRET: 'insecure_secret'
      OPENID_PROVIDER_URL: 'https://myauthelia/.well-known/openid-configuration'
      OAUTH_PROVIDER_NAME: 'Authelia'
      OAUTH_SCOPES: 'openid email profile groups'
      ENABLE_OAUTH_ROLE_MANAGEMENT: 'true'
      OAUTH_ALLOWED_ROLES: 'openwebui-user,openwebui-admin'
      OAUTH_ADMIN_ROLES: 'openwebui-admin'
      OAUTH_ROLES_CLAIM: 'groups'
    depends_on:
      - litellm
    networks:
      - litellm
      - ollama

  # https://github.com/SYSTRAN/faster-whisper/issues/162
  #   -> https://github.com/OpenNMT/CTranslate2/issues/1072
  #     -> Dockerfile https://gist.github.com/muaiyadh/d99923375f5d35b5b08e8369705fa41a
  #       -> with patch https://github.com/OpenNMT/CTranslate2/issues/1072#issuecomment-2686736426
  # faster-whisper:

  # https://github.com/mendableai/firecrawl/

  # https://github.com/dzhng/deep-research

  # https://github.com/open-webui/mcpo
  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo
    <<: [ *restart_failure, *logging, *security ]
    command: --api-key "top-secret" -- your_mcp_server_command
    ports:
      - 8000:8000
    networks:
      - mcpo

  # Speech-to-text
  # Options listed on: https://github.com/SYSTRAN/faster-whisper#community-integrations
  # https://github.com/speaches-ai/speaches -> https://github.com/speaches-ai/speaches/issues/22 DOES NOT SUPPORT ROCM
  rocm-whisper-api-service:
    image: jjajjara/rocm-whisper-api:latest # Ensure this matches your pushed Docker Hub image tag (e.g., your_username/rocm-whisper-api:latest)
    container_name: rocm-whisper-api
    <<: [ *restart_failure, *logging, *security ]
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.0 # <<< IMPORTANT: Adjust this based on your specific AMD GPU model if needed
      - WHISPER_MODEL=base             # Change to 'small', 'medium', 'large', etc., as required
    devices:
      - "/dev/kfd:/dev/kfd" # Essential for ROCm Kernel Fusion Device access
      - "/dev/dri:/dev/dri" # Essential for Direct Rendering Infrastructure access for GPU
    # (Optional) Volume setup for model caching.
    # Uncomment the following lines to persist downloaded Whisper models on your host PC
    # to prevent re-downloading on container restarts and save bandwidth/time.
    # volumes:
    #   - ~/.cache/whisper:/root/.cache/whisper
    ports:
      - "8080:8080" # Maps container port 8080 on the host to container port 8080
    networks:
      - whisper
    

networks: # subnets are defined to avoid overlaps
  default:
    ipam:
      config:
        - subnet: 10.201.1.0/24
          gateway: 10.201.1.1

  vllm:
    ipam:
      config:
        - subnet: 10.201.2.0/24

  vllm:
    ipam:
      config:
        - subnet: 10.201.2.0/24

  open-webui:
    ipam:
      config:
        - subnet: 10.201.5.0/24

  mcpo:
    internal: true
    ipam:
      config:
        - subnet: 10.201.8.0/24

  firecrawl:
    ipam:
      config:
        - subnet: 10.201.9.0/24
